name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha spec selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [16.x, 17.x, 18.x, 19.x, 20.x, 21.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build --if-present
      - name: npm test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run clean && npm run lint && npx tsc && npx mocha ${{ inputs.test-filter }}
          else
            npm test
          fi

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 21.5.0
        uses: actions/setup-node@v4
        with:
          node-version: 21.5.0
      - run: npm ci
      - name: Pin npm to the version that packed the published tarball
        run: npm i -g npm@10.2.4
      - run: npm pack
      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: basic-ftp-5.0.5-tgz
          path: basic-ftp-5.0.5.tgz
          if-no-files-found: error
